Depuis octobre, BotJanus bénéficie d'un nouvel hébergement lui permettant de marcher 24h/24 sans coupures.

En effet, BotJanus a besoin de cette régularité par l'intégration d'un [robot Discord](https://github.com/BotJanus/BotJanus-Discord) et d'un robot Vikidia tournant tout le temps pour surveiller les nouveaux fichiers : [BotJanus-RC-images](https://github.com/BotJanus/BotJanus-RC-images).
